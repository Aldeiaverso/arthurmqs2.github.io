<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ALDEIAVERSO — Raízes da Batalha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Anton&family=Barlow+Condensed:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0a1512;
  --panel:#122019;
  --panel-2:#182a20;
  --line:#2b3f30;
  --amber:#e8912f;
  --amber-soft:rgba(232,145,47,.14);
  --ember:#ff6a3d;
  --leaf:#7fb069;
  --gold:#d9a441;
  --ink:#f3ede0;
  --muted:#8fa392;
  --disp:'Rye', serif;
  --num:'Anton', sans-serif;
  --body:'Barlow Condensed', sans-serif;
  --mono:'Space Mono', monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--void);color:var(--ink);font-family:var(--body);overflow-x:hidden;}
body{
  min-height:100vh;
  background-image:
    radial-gradient(ellipse 60% 40% at 50% 0%, rgba(127,176,105,0.10), transparent 60%),
    radial-gradient(ellipse 80% 50% at 50% 100%, rgba(232,145,47,0.16), transparent 65%),
    linear-gradient(180deg, #0a1512 0%, #0d1a15 55%, #120f0a 100%);
  background-attachment:fixed;
}
button{font-family:inherit;}
::selection{background:var(--amber); color:#0a1512;}
::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
svg.icon{display:block;}

.screen{min-height:100vh; display:flex; flex-direction:column; padding:20px 16px 60px; max-width:1100px; margin:0 auto; animation:fadein .35s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

/* ---------- BRAND / CREST ---------- */
.crest{display:flex; justify-content:center; margin:22px 0 2px;}
.crest svg{width:76px; height:76px; filter:drop-shadow(0 0 14px rgba(232,145,47,.25));}
.crest .brand-logo{width:96px; height:auto; filter:drop-shadow(0 0 16px rgba(232,145,47,.3));}
.brand{display:flex; align-items:baseline; justify-content:center; gap:10px; margin:2px 0 4px; flex-wrap:wrap;}
.brand h1{font-family:var(--disp); font-weight:400; font-size:clamp(2.3rem,8vw,4rem); letter-spacing:2px; margin:0; line-height:1;
  color:var(--ink); text-shadow:0 0 30px rgba(232,145,47,0.25);}
.rule{width:110px; height:2px; margin:10px auto 12px; background:linear-gradient(90deg, transparent, var(--amber), transparent);}
.eyebrow{text-align:center; color:var(--muted); font-size:.72rem; letter-spacing:3px; text-transform:uppercase; font-family:var(--mono); display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;}
.eyebrow .leaf-ico{width:10px; height:10px; color:var(--leaf); opacity:.8;}
.subtitle{text-align:center; color:var(--muted); font-size:1.05rem; margin:16px 0 28px; letter-spacing:.3px; max-width:640px; margin-left:auto; margin-right:auto;}
.subtitle b{color:var(--amber); font-weight:600;}

/* ---------- EDITION GRID ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px;}
.card{position:relative; background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:18px; cursor:pointer;
  transition:transform .15s ease, border-color .15s ease; overflow:hidden;}
.card::after{content:''; position:absolute; left:0; right:0; bottom:0; height:3px; background:linear-gradient(90deg, var(--leaf), var(--amber)); opacity:0; transition:opacity .2s;}
.card:hover{transform:translateY(-3px); border-color:var(--amber);}
.card:hover::after{opacity:1;}
.card.locked{cursor:not-allowed; opacity:.5;}
.card.locked:hover{transform:none; border-color:var(--line);}
.card .num{font-family:var(--mono); color:var(--muted); font-size:.75rem;}
.card h3{font-family:var(--disp); font-weight:400; font-size:1.35rem; margin:6px 0 8px; letter-spacing:.5px; color:var(--ink);}
.card p{margin:0; font-size:.85rem; color:var(--muted); line-height:1.4;}
.badge{display:inline-block; font-family:var(--mono); font-size:.63rem; letter-spacing:1px; text-transform:uppercase; padding:3px 8px; border-radius:3px; margin-top:10px; border:1px solid;}
.badge.open{background:var(--amber-soft); color:var(--amber); border-color:rgba(232,145,47,.4);}
.badge.locked{background:rgba(143,163,146,.08); color:var(--muted); border-color:var(--line);}
.lock-icon{position:absolute; top:14px; right:14px; font-size:1rem; opacity:.5;}

/* ---------- TOPBAR ---------- */
.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:10px; flex-wrap:wrap;}
.btn{font-family:var(--body); font-weight:600; letter-spacing:.5px; border:1px solid var(--line); background:var(--panel); color:var(--ink);
  padding:10px 18px; border-radius:4px; cursor:pointer; font-size:.95rem; transition:all .15s;}
.btn:hover{border-color:var(--amber); color:var(--amber);}
.btn.primary{background:var(--amber); color:#1a1006; border-color:var(--amber); font-weight:700;}
.btn.primary:hover{background:#f5a446;}
.btn.primary:disabled{background:var(--panel-2); color:var(--muted); border-color:var(--line); cursor:not-allowed;}
.btn.ember{border-color:var(--ember);} .btn.ember:hover{color:var(--ember);}
.pill{font-family:var(--mono); font-size:.68rem; padding:6px 12px; border-radius:20px; background:var(--panel-2); border:1px solid var(--line); color:var(--muted);}

/* ---------- STAGE TRACKER (path) ---------- */
.path{display:flex; align-items:center; justify-content:center; gap:6px; margin:6px 0 24px; flex-wrap:wrap;}
.path-node{display:flex; flex-direction:column; align-items:center; gap:4px; min-width:74px;}
.path-dot{width:34px; height:34px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:.75rem; color:var(--muted); background:var(--panel);}
.path-node.done .path-dot{border-color:var(--leaf); color:var(--leaf); background:rgba(127,176,105,.12);}
.path-node.current .path-dot{border-color:var(--amber); color:var(--amber); background:var(--amber-soft); box-shadow:0 0 14px rgba(232,145,47,.35);}
.path-node.lost .path-dot{border-color:var(--ember); color:var(--ember); background:rgba(255,106,61,.1);}
.path-lbl{font-size:.65rem; letter-spacing:1px; text-transform:uppercase; color:var(--muted); font-family:var(--mono);}
.path-line{width:26px; height:2px; background:var(--line); margin-bottom:18px;}
.path-line.done{background:var(--leaf);}

/* ---------- ROSTER ---------- */
.section-title{font-family:var(--disp); font-weight:400; font-size:1.5rem; letter-spacing:.5px; margin:6px 0 4px; color:var(--ink);}
.section-sub{color:var(--muted); font-size:.88rem; margin:0 0 16px;}
.roster{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; margin-bottom:90px;}
.mc-card{background:var(--panel); border:2px solid var(--line); border-radius:6px; padding:12px; cursor:pointer; text-align:center; position:relative; transition:all .15s;}
.mc-card:hover{border-color:var(--muted);}
.mc-card.selected{border-color:var(--amber); background:linear-gradient(180deg, var(--amber-soft), var(--panel));}
.mc-card.selected .order{display:flex;}
.mc-card .avatar{width:58px; height:58px; border-radius:50%; margin:0 auto 8px; display:flex; align-items:center; justify-content:center;
  font-family:var(--num); font-size:1.25rem; color:#1a1006; border:2px solid rgba(0,0,0,.25);}
.mc-card .name{font-weight:700; font-size:1rem; margin-bottom:2px;}
.mc-card .state{font-family:var(--mono); font-size:.62rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px;}
.mc-card .ovr{font-family:var(--num); font-size:1.1rem; color:var(--gold); margin-top:6px;}
.mc-card .ovr-label{font-family:var(--mono); font-size:.55rem; color:var(--muted); letter-spacing:1px;}
.mc-card .role-tag{position:absolute; top:8px; left:8px; font-size:.58rem; font-family:var(--mono); padding:2px 6px; border-radius:3px; letter-spacing:.5px;}
.role-tag.campeao{background:rgba(217,164,65,.2); color:var(--gold); border:1px solid rgba(217,164,65,.45);}
.role-tag.final{background:rgba(255,106,61,.15); color:var(--ember); border:1px solid rgba(255,106,61,.4);}
.role-tag.semifinal,.role-tag.fase2,.role-tag.fase1{background:rgba(143,163,146,.15); color:var(--muted); border:1px solid var(--line);}
.order{position:absolute; top:8px; right:8px; width:22px; height:22px; border-radius:50%; background:var(--amber); color:#1a1006;
  font-family:var(--mono); font-weight:700; font-size:.75rem; align-items:center; justify-content:center; display:none;}
.esports-tag{font-size:.58rem; font-family:var(--mono); color:var(--muted); margin-top:3px;}

.dock{position:fixed; bottom:0; left:0; right:0; background:rgba(10,21,18,.92); backdrop-filter:blur(10px); border-top:1px solid var(--line);
  padding:12px 16px; display:flex; align-items:center; justify-content:center; gap:14px; z-index:50; flex-wrap:wrap;}
.dock .slots{display:flex; gap:8px;}
.slot{width:42px; height:42px; border-radius:6px; border:1px dashed var(--line); display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:.7rem; color:var(--muted); background:var(--panel);}
.slot.filled{border-style:solid; border-color:var(--amber); color:var(--amber); font-weight:700;}

/* ---------- ARENA (octógono + torcida ao redor) ---------- */
.octagon-wrap{display:flex; justify-content:center; margin:10px 0 26px;}
.arena{position:relative; width:min(94vw,460px); aspect-ratio:1;}

.crowd-ring{position:absolute; inset:0; pointer-events:none; z-index:1;}
.crowd-dot{position:absolute; border-radius:50%; transform:translate(-50%,-50%); animation:crowdBob 1.6s ease-in-out infinite; opacity:.85; box-shadow:0 0 4px rgba(0,0,0,.4);}
.crowd-ring.hype .crowd-dot{animation-duration:.42s; opacity:1;}
@keyframes crowdBob{
  0%,100%{ transform:translate(-50%,-50%) translateY(0) scale(1); }
  50%{ transform:translate(-50%,-50%) translateY(-5px) scale(1.12); }
}

.octagon{position:absolute; left:16%; top:16%; width:68%; height:68%; z-index:2;
  clip-path:polygon(30% 0%,70% 0%,100% 30%,100% 70%,70% 100%,30% 100%,0% 70%,0% 30%);
  background:linear-gradient(155deg, #16261d, #0c1310 70%); border:2px solid var(--line); box-shadow:inset 0 0 60px rgba(232,145,47,0.08);
  display:flex; align-items:center; justify-content:center;}
.octagon .center-vs{font-family:var(--num); font-size:1.9rem; color:var(--ember); text-shadow:0 0 20px rgba(255,106,61,.5); letter-spacing:2px;}

.corner-mc{position:absolute; width:74px; text-align:center; z-index:3; transform:translate(-50%,-50%);}
.corner-mc .avatar{width:50px; height:50px; margin:0 auto 4px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--num); color:#1a1006; font-size:1.05rem; border:2px solid var(--void);}
.corner-mc .nm{font-size:.68rem; font-weight:700; line-height:1.1; text-shadow:0 1px 3px rgba(0,0,0,.8);}
.corner-mc.p1{left:29%; top:27%;} .corner-mc.p2{left:23%; top:50%;} .corner-mc.p3{left:29%; top:73%;}
.corner-mc.o1{left:71%; top:27%;} .corner-mc.o2{left:77%; top:50%;} .corner-mc.o3{left:71%; top:73%;}

.teams-row{display:flex; justify-content:space-between; gap:16px; margin-bottom:6px; flex-wrap:wrap;}
.team-box{flex:1; min-width:220px; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:14px;}
.team-box h4{margin:0 0 8px; font-family:var(--disp); font-weight:400; font-size:1.05rem; letter-spacing:.5px;}
.team-box.you h4{color:var(--amber);} .team-box.rival h4{color:var(--ember);}
.team-mc{display:flex; align-items:center; gap:8px; padding:4px 0; font-size:.85rem;}
.team-mc .dot{width:8px; height:8px; border-radius:50%; background:var(--muted);}
.hist-note{max-width:640px; margin:14px auto 0; background:rgba(217,164,65,.08); border:1px solid rgba(217,164,65,.3); border-radius:6px;
  padding:10px 14px; font-size:.82rem; color:var(--muted); text-align:center;}
.hist-note b{color:var(--gold);}

/* ---------- ROUNDS ---------- */
.round-tracker{display:flex; justify-content:center; gap:8px; margin:14px 0 20px; flex-wrap:wrap;}
.rnd-chip{font-family:var(--mono); font-size:.72rem; padding:8px 12px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--muted); min-width:66px; text-align:center;}
.rnd-chip.you{border-color:var(--amber); color:var(--amber); background:var(--amber-soft);}
.rnd-chip.rival{border-color:var(--ember); color:var(--ember); background:rgba(255,106,61,.08);}
.rnd-chip.pending{opacity:.4;}
.rnd-chip small{display:block; font-size:.55rem; color:var(--muted); margin-top:2px;}

.score-big{display:flex; align-items:center; justify-content:center; gap:22px; margin:8px 0 18px;}
.score-big .num{font-family:var(--num); font-size:3rem;}
.score-big .num.you{color:var(--amber);} .score-big .num.rival{color:var(--ember);}
.score-big .x{font-family:var(--num); color:var(--muted); font-size:1.7rem;}

.log{max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:8px;}
.log-item{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--line); border-radius:6px; padding:10px 14px; font-size:.87rem; opacity:0; animation:slidein .4s forwards;}
.log-item.win-you{border-left-color:var(--amber);}
.log-item.win-rival{border-left-color:var(--ember);}
@keyframes slidein{from{opacity:0; transform:translateX(-8px);} to{opacity:1; transform:translateX(0);}}
.log-item b{color:var(--ink);}
.log-item .rtitle{font-family:var(--mono); font-size:.63rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); display:block; margin-bottom:3px;}

.center-actions{display:flex; justify-content:center; gap:12px; margin-top:22px; flex-wrap:wrap;}
.stage-outcome{text-align:center; margin-top:26px; padding-top:20px; border-top:1px solid var(--line);}
.stage-outcome .msg{font-family:var(--disp); font-weight:400; font-size:1.6rem;}
.stage-outcome .msg.win{color:var(--leaf);}
.stage-outcome .msg.lose{color:var(--ember);}

/* ---------- CHAMPION / RESULT ---------- */
.result-hero{text-align:center; margin:26px 0;}
.result-hero .big{font-family:var(--disp); font-weight:400; font-size:clamp(2.1rem,9vw,3.6rem); letter-spacing:1px;}
.result-hero .big.win{color:var(--gold); text-shadow:0 0 40px rgba(217,164,65,.35);}
.result-hero .big.lose{color:var(--ember); text-shadow:0 0 40px rgba(255,106,61,.3);}
.mvp-box{max-width:340px; margin:20px auto; background:var(--panel); border:1px solid var(--gold); border-radius:8px; padding:18px; text-align:center;}
.mvp-box .lbl{font-family:var(--mono); font-size:.68rem; color:var(--gold); letter-spacing:2px;}
.mvp-box .nm{font-family:var(--disp); font-weight:400; font-size:1.5rem; margin:6px 0;}
.path-summary{max-width:480px; margin:18px auto; display:flex; flex-direction:column; gap:8px;}
.path-summary .row{display:flex; justify-content:space-between; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px 14px; font-size:.85rem;}
.path-summary .row span.res{font-family:var(--mono); font-weight:700;}
.path-summary .row span.res.w{color:var(--leaf);} .path-summary .row span.res.l{color:var(--ember);}

.footer-note{text-align:center; color:var(--muted); font-size:.72rem; margin-top:40px; line-height:1.6; max-width:680px; margin-left:auto; margin-right:auto;}
.footer-note a{color:var(--amber);}

/* ---------- MODE SELECT ---------- */
.mode-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:18px; max-width:720px; margin:10px auto 0;}
.mode-card{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:24px 20px; cursor:pointer; text-align:center; transition:all .15s;}
.mode-card:hover{border-color:var(--amber); transform:translateY(-3px);}
.mode-card .tag{font-family:var(--mono); font-size:.62rem; letter-spacing:2px; color:var(--amber);}
.mode-card h3{font-family:var(--disp); font-weight:400; font-size:1.6rem; margin:8px 0 10px; color:var(--ink);}
.mode-card p{color:var(--muted); font-size:.85rem; line-height:1.5; margin:0;}
.mode-swipe-hint{display:none; text-align:center; color:var(--muted); font-family:var(--mono); font-size:.65rem; letter-spacing:1px; margin-top:10px;}
.mode-dots{display:none; justify-content:center; gap:6px; margin-top:10px;}
.mode-dots .dot{width:6px; height:6px; border-radius:50%; background:var(--line); transition:background .2s, transform .2s;}
.mode-dots .dot.active{background:var(--amber); transform:scale(1.3);}

@media (max-width:640px){
  .mode-grid{
    display:flex;
    grid-template-columns:none;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    gap:14px;
    max-width:none;
    margin:10px 0 0;
    padding:4px 12vw 6px;
    scroll-padding:0 12vw;
  }
  .mode-card{flex:0 0 76vw; scroll-snap-align:center;}
  .mode-swipe-hint{display:block;}
  .mode-dots{display:flex;}
}

/* ---------- LEVEL BADGE ---------- */
.lvl-badge{display:inline-flex; align-items:center; gap:8px; background:var(--panel-2); border:1px solid var(--line); border-radius:20px; padding:5px 12px 5px 5px;}
.lvl-badge .circle{width:26px; height:26px; border-radius:50%; background:linear-gradient(135deg,var(--amber),var(--gold)); display:flex; align-items:center; justify-content:center; font-family:var(--num); font-size:.68rem; color:#1a1006; flex-shrink:0;}
.lvl-badge .bar{width:56px; height:5px; background:var(--line); border-radius:3px; overflow:hidden;}
.lvl-badge .bar-fill{height:100%; background:var(--amber); transition:width .5s ease;}
.lvl-badge .xp-txt{font-family:var(--mono); font-size:.58rem; color:var(--muted); white-space:nowrap;}
.lvl-badge-wrap{display:flex; justify-content:center; margin:14px 0 6px;}

/* ---------- DRAFT ---------- */
.draft-group{margin-bottom:24px;}
.draft-group h4{font-family:var(--disp); font-weight:400; font-size:1.1rem; color:var(--muted); margin:0 0 10px; text-align:center;}
.draft-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:560px; margin:0 auto;}
.draft-reveal{animation:draftReveal .5s cubic-bezier(.2,.8,.3,1.2) both;}
@keyframes draftReveal{
  0%{ opacity:0; transform:translateY(14px) scale(.94); }
  60%{ opacity:1; }
  100%{ opacity:1; transform:translateY(0) scale(1); }
}
.draft-committed-list{max-width:560px; margin:0 auto 20px; display:flex; flex-direction:column; gap:8px;}
.draft-committed-row{display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--amber); border-radius:6px; padding:8px 12px; font-size:.82rem;}
.dc-step{font-family:var(--num); color:var(--amber); min-width:24px;}
.dc-avatar{width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--num); font-size:.65rem; color:#1a1006; flex-shrink:0;}
.dc-name{flex:1; color:var(--ink);}
.dc-from{color:var(--muted); font-size:.72rem; white-space:nowrap;}

/* ---------- BATTLE: matchup / score / crowd ---------- */
.matchup-banner{text-align:center; margin:14px 0 4px; min-height:56px;}
.matchup-banner .type{font-family:var(--mono); font-size:.66rem; letter-spacing:2px; color:var(--muted); text-transform:uppercase;}
.matchup-banner .vs{font-family:var(--disp); font-weight:400; font-size:1.4rem; margin-top:6px; display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; color:var(--ink);}
.matchup-banner .vs .x{color:var(--muted); font-family:var(--num); font-size:1rem;}

.crowd-lbl{text-align:center; font-family:var(--mono); font-size:.6rem; color:var(--muted); letter-spacing:1px; margin:4px 0 6px;}
.crowd-wrap{max-width:380px; margin:0 auto 4px;}
.crowd-pct{display:flex; justify-content:space-between; font-family:var(--num); font-size:.95rem; margin-bottom:3px;}
.crowd-pct .you{color:var(--amber);} .crowd-pct .rival{color:var(--ember);}
.crowd-meter{position:relative; height:16px; border-radius:8px; overflow:hidden; display:flex; border:1px solid var(--line); background:var(--panel); transition:opacity .3s; box-shadow:inset 0 1px 3px rgba(0,0,0,.4);}
.crowd-meter .fill-you{background:linear-gradient(90deg,#c97620,var(--amber)); transition:width .6s ease; box-shadow:0 0 10px rgba(232,145,47,.5);}
.crowd-meter .fill-rival{background:linear-gradient(90deg,var(--ember),#c9401f); transition:width .6s ease; box-shadow:0 0 10px rgba(255,106,61,.5);}
.crowd-meter .crowd-tick{position:absolute; left:50%; top:0; bottom:0; width:2px; background:rgba(255,255,255,.35); z-index:2;}
.crowd-meter.pulse{animation:crowdpulse .7s ease infinite;}
.crowd-impact{max-width:380px; margin:6px auto 0; text-align:center; font-size:.78rem; color:var(--muted); min-height:1.3em;}
.crowd-impact b{font-family:var(--mono);}
@keyframes crowdpulse{0%,100%{opacity:1;} 50%{opacity:.55;}}

.round-scorebox{display:flex; justify-content:center; gap:24px; align-items:center; margin:10px 0 6px; min-height:56px;}
.round-scorebox .sc{font-family:var(--num); font-size:2.1rem; min-width:66px; text-align:center;}
.round-scorebox .sc.you{color:var(--amber);} .round-scorebox .sc.rival{color:var(--ember);}
.round-scorebox .sc.reveal{animation:popin .4s ease forwards;}
@keyframes popin{from{opacity:0; transform:scale(.7);} to{opacity:1; transform:scale(1);}}
.round-scorebox .slash{font-family:var(--num); color:var(--muted); font-size:1.3rem;}

.round-result-banner{text-align:center; font-family:var(--disp); font-weight:400; font-size:1.15rem; margin:2px 0 10px; min-height:1.4em;}
.round-result-banner.you{color:var(--amber);} .round-result-banner.rival{color:var(--ember);}
.round-result-banner .reaction{display:block; color:var(--muted); font-family:var(--body); font-size:.82rem; margin-top:2px;}

/* ---------- OCTAGON battle-state ---------- */
.corner-mc{transition: opacity .35s ease, transform .35s ease;}
.corner-mc .avatar{transition: box-shadow .35s ease, transform .35s ease, filter .35s ease, opacity .35s ease;}
.corner-mc.dim{opacity:.35; transform:translate(-50%,-50%) scale(.86);}
.corner-mc.active .avatar{box-shadow:0 0 0 4px rgba(232,145,47,.35), 0 0 22px rgba(232,145,47,.5); transform:scale(1.1);}
.corner-mc.active.rival-side .avatar{box-shadow:0 0 0 4px rgba(255,106,61,.35), 0 0 22px rgba(255,106,61,.5);}
.corner-mc.active.winner .avatar, .corner-mc.dim.winner .avatar{box-shadow:0 0 0 4px rgba(217,164,65,.65), 0 0 30px rgba(217,164,65,.85); transform:scale(1.22); opacity:1;}
.corner-mc.active.loser .avatar, .corner-mc.dim.loser .avatar{filter:grayscale(.7); opacity:.45; box-shadow:none; transform:scale(.92);}

/* microfone + movimento de quem está rimando */
.corner-mc .avatar{position:relative;}
.corner-mc .mic{position:absolute; bottom:-6px; right:-6px; font-size:1rem; opacity:0; transform:scale(.5) rotate(-20deg); transition:opacity .25s ease, transform .25s ease; filter:drop-shadow(0 0 4px rgba(0,0,0,.6));}
.corner-mc.rapping .mic{opacity:1; transform:scale(1) rotate(0deg);}
.corner-mc.rapping .avatar{animation:rapMove .55s ease-in-out infinite alternate;}
.corner-mc.rapping.rival-side .avatar{animation-name:rapMoveRival;}
@keyframes rapMove{
  0%{ transform:scale(1.12) translate(0,0) rotate(-4deg); }
  50%{ transform:scale(1.15) translate(2px,-7px) rotate(3deg); }
  100%{ transform:scale(1.12) translate(-2px,-2px) rotate(-2deg); }
}
@keyframes rapMoveRival{
  0%{ transform:scale(1.12) translate(0,0) rotate(4deg); }
  50%{ transform:scale(1.15) translate(-2px,-7px) rotate(-3deg); }
  100%{ transform:scale(1.12) translate(2px,-2px) rotate(2deg); }
}

/* ---------- HISTORY / OUTCOME ---------- */
.history-log{max-width:640px; margin:14px auto 0; display:flex; flex-direction:column; gap:8px;}
.history-item{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--line); border-radius:6px; padding:9px 14px; font-size:.82rem; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; opacity:0; animation:slidein .4s forwards;}
.history-item.you{border-left-color:var(--amber);}
.history-item.rival{border-left-color:var(--ember);}
.history-item .lbl{color:var(--muted); font-family:var(--mono); font-size:.64rem; text-transform:uppercase; display:block; margin-bottom:2px;}
.history-item .sc{font-family:var(--num); font-size:1rem; white-space:nowrap;}
@keyframes slidein{from{opacity:0; transform:translateX(-8px);} to{opacity:1; transform:translateX(0);}}

.xp-toast{max-width:340px; margin:10px auto 0; text-align:center; background:var(--amber-soft); border:1px solid rgba(232,145,47,.4); border-radius:8px; padding:9px; font-family:var(--mono); font-size:.82rem; color:var(--amber);}
.xp-toast.levelup{background:rgba(217,164,65,.15); border-color:var(--gold); color:var(--gold); font-family:var(--disp); font-weight:400; font-size:1.05rem; margin-top:8px;}

/* ---------- CHAMPION TAG (edition card) ---------- */
.champion-tag{margin-top:10px; font-family:var(--mono); font-size:.68rem; color:var(--gold); background:rgba(217,164,65,.1); border:1px solid rgba(217,164,65,.3); border-radius:4px; padding:5px 8px; line-height:1.4;}
.champion-tag s{opacity:.65;}
.champion-tag.rewritten{color:var(--amber); background:var(--amber-soft); border-color:rgba(232,145,47,.4); margin-top:6px;}

/* ---------- REAL TRIO PICKER ---------- */
.real-trio-list{display:flex; flex-direction:column; gap:12px; max-width:560px; margin:0 auto;}
.real-trio-card{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; cursor:pointer; transition:all .15s;}
.real-trio-card:hover{border-color:var(--amber);}
.rt-label{font-family:var(--disp); font-weight:400; font-size:1.1rem; color:var(--ink); display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.rt-tag{font-family:var(--mono); font-size:.6rem; padding:2px 6px; border-radius:3px; background:rgba(143,163,146,.15); color:var(--muted); border:1px solid var(--line);}
.rt-tag.campeao{background:rgba(217,164,65,.2); color:var(--gold); border-color:rgba(217,164,65,.45);}
.rt-tag.final{background:rgba(255,106,61,.15); color:var(--ember); border-color:rgba(255,106,61,.4);}
.rt-members{color:var(--muted); font-size:.88rem; margin-top:6px;}
.rt-note{color:var(--muted); font-size:.78rem; margin-top:6px; font-style:italic;}

/* ---------- HISTORY FLIP ---------- */
.history-flip{max-width:520px; margin:16px auto; background:var(--panel); border:1px solid var(--gold); border-radius:8px; padding:16px; text-align:center;}
.flip-old,.flip-old-row{font-size:.88rem; color:var(--muted); margin-bottom:4px;}
.flip-old s{color:var(--ember); opacity:.8;}
.ed-tag{font-family:var(--mono); font-size:.6rem; color:var(--amber); background:var(--amber-soft); border-radius:3px; padding:2px 6px; margin-right:6px;}
.flip-arrow{font-family:var(--num); color:var(--gold); font-size:1.3rem; margin:4px 0;}
.flip-new{font-family:var(--disp); font-weight:400; font-size:1.1rem; color:var(--ink);}
.flip-new.player{color:var(--gold);}
.flip-new b{color:var(--gold);}
.flip-same{font-size:.92rem; color:var(--leaf);}

/* ---------- SIM LOG ---------- */
.sim-log{max-width:560px; margin:0 auto 6px; display:flex; flex-direction:column; gap:8px;}
.sim-row{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:9px 14px; font-size:.83rem; color:var(--muted);}
.sim-row b{color:var(--ink);}

/* ---------- HISTÓRICO DO JOGADOR ---------- */
.stats-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; max-width:680px; margin:16px auto 0;}
.stat-card{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px 10px; text-align:center;}
.stat-num{font-family:var(--num); font-size:1.8rem; color:var(--amber);}
.stat-lbl{font-family:var(--mono); font-size:.62rem; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-top:4px;}
.highlight-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; max-width:560px; margin:14px auto 0;}
.highlight-card{background:var(--panel); border:1px solid var(--gold); border-radius:8px; padding:16px; text-align:center;}
.hl-lbl{font-family:var(--mono); font-size:.65rem; color:var(--gold); letter-spacing:1px; text-transform:uppercase;}
.hl-val{font-family:var(--disp); font-weight:400; font-size:1.2rem; margin:6px 0 2px; color:var(--ink);}
.hl-ed{font-family:var(--mono); font-size:.6rem; color:var(--muted);}
.hl-sub{font-family:var(--mono); font-size:.68rem; color:var(--muted);}

.rank-list{max-width:520px; margin:10px auto 0; display:flex; flex-direction:column; gap:6px;}
.rank-row{display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px 14px; font-size:.85rem;}
.rank-pos{font-family:var(--num); color:var(--amber); min-width:26px;}
.rank-name{flex:1; color:var(--ink);}
.rank-count{font-family:var(--mono); font-size:.72rem; color:var(--muted); white-space:nowrap;}
</style>
</head>

   Fontes: matérias sobre a Batalha da Aldeia (Rap na Rua, Rap Mais,
   Billboard Brasil, KondZilla, Portal RND, Farol da Bahia, Wikipédia
   "BDA Anos"), anúncios oficiais de trios (@batalhadaaldeia) e títulos
   de vídeos de fase/semifinal/final publicados no YouTube.
   Overalls (0-100) são uma métrica de JOGO criada a partir de conquistas
   documentadas (título, vice, fase em que foi eliminado, MVP, quantidade
   de títulos citada nas matérias) — não é nota oficial da organização.
========================================================= */
const COLORS = ['#e8912f','#7fb069','#d9a441','#4fb8a6','#c97b4a','#a3c586','#e0684a','#8fb8c9'];
function colorFor(name){
  let h=0; for(const c of name) h = (h*31 + c.charCodeAt(0))>>>0;
  return COLORS[h % COLORS.length];
}
function initials(name){
  return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
}

/* torcida ao redor do octógono: dois anéis de "cabeças" distribuídas em círculo */
const CROWD_COLORS = ['#e8912f','#d9a441','#7fb069','#c97b4a','#8fa392','#ff6a3d','#4fb8a6','#f3ede0','#c4915a'];
function buildCrowd(){
  let dots = '';
  function ring(count, radius, sizeMin, sizeMax){
    for(let i=0;i<count;i++){
      const angle = (i/count)*Math.PI*2 + (radius*0.01); // leve defasagem entre anéis
      const x = (50 + radius*Math.cos(angle)).toFixed(1);
      const y = (50 + radius*Math.sin(angle)).toFixed(1);
      const size = (sizeMin + Math.random()*(sizeMax-sizeMin)).toFixed(1);
      const color = CROWD_COLORS[Math.floor(Math.random()*CROWD_COLORS.length)];
      const delay = (Math.random()*1.6).toFixed(2);
      dots += `<div class="crowd-dot" style="left:${x}%; top:${y}%; width:${size}px; height:${size}px; background:${color}; animation-delay:-${delay}s;"></div>`;
    }
  }
  ring(22, 43, 8, 11);
  ring(30, 49.5, 6, 9);
  return dots;
}

const STAGE_LABEL = {fase1:'Fase 1', fase2:'Fase 2', semifinal:'Semifinal', final:'Final'};
const STAGE_ORDER = ['fase1','fase2','semifinal','final'];
const ROLE_LABEL = {campeao:'Campeão', final:'Vice', semifinal:'Semifinal', fase2:'Fase 2', fase1:'Fase 1'};

function trioMemberNames(trio){ return trio.members.map(id=>mcById(id).name).join(', '); }
function trioDisplayLabel(trio){
  const names = trioMemberNames(trio);
  if(!trio.label || trio.label==='Trio') return names;
  return `${trio.label} (${names})`;
}

/* sincroniza os pontinhos do carrossel de modos com a posição do scroll (mobile) */
function setupModeSwipe(){
  const grid = document.getElementById('modeGrid');
  const dots = document.getElementById('modeDots');
  if(!grid || !dots) return;
  const dotEls = dots.querySelectorAll('.dot');
  grid.addEventListener('scroll', ()=>{
    const idx = Math.round(grid.scrollLeft / (grid.scrollWidth / dotEls.length));
    dotEls.forEach((d,i)=> d.classList.toggle('active', i===idx));
  }, {passive:true});
}

function chooseMode(mode){
  state.mode = mode;
  if(mode==='draft12'){ startDraftGlobal(); }
  else { state.screen='editionSelect'; render(); }
}
function goHome(){
  state.screen='home'; state.mode=null; state.editionId=null; state.selected=[];
  state.usingRealTrio=null; state.draft=null; state.run=null; state.battle=null; state.simResult=null;
  render();
}
function goHistory(){ state.screen='history'; render(); }

/* ============================= HISTÓRICO DO JOGADOR ============================= */
function topEntry(obj){
  const entries = Object.entries(obj||{});
  if(!entries.length) return null;
  entries.sort((a,b)=>b[1]-a[1]);
  const mc = mcById(entries[0][0]);
  if(!mc) return null;
  return {mc, count:entries[0][1]};
}
function rankingList(obj, limit){
  const entries = Object.entries(obj||{});
  entries.sort((a,b)=>b[1]-a[1]);
  return entries.slice(0,limit).map(([id,count])=>({mc:mcById(id), count})).filter(r=>r.mc);
}
function renderHistory(){
  const s = state.profile.stats;
  const total = s.battlesFought||0;
  const winRate = total? Math.round((s.battlesWon/total)*100) : 0;
  const mostUsed = topEntry(s.mcUsage);
  const mostMvp = topEntry(s.mvpCount);
  const topChampions = rankingList(s.championCount, 5);
  const topMvps = rankingList(s.mvpCount, 5);

  const rankRows = (list, unit) => list.length? list.map((r,i)=>`<div class="rank-row"><span class="rank-pos">${i+1}º</span><span class="rank-name">${r.mc.name} <span class="hl-ed">(${r.mc.editionShort})</span></span><span class="rank-count">${r.count} ${unit}</span></div>`).join('') : '<p class="subtitle" style="margin:8px 0;">Ainda sem dados suficientes.</p>';

/* ============================= MODO 12-0: DRAFT GLOBAL (todas as edições) ============================= */
/* Revelação sequencial: um trio aparece por vez; o próximo só surge após o jogador escolher
   1 MC do trio atual. O jogador pode "sortear outro trio" (trocar o trio atual, não o já
   escolhido) no máximo 3 vezes por draft inteiro. */
const DRAFT_MAX_REROLLS = 3;

function pickRandomFrom(poolArr){ return poolArr[Math.floor(Math.random()*poolArr.length)]; }

function startDraftGlobal(){
  state.editionId=null; state.usingRealTrio=null;
  state.selected=[]; state.run=null; state.battle=null; state.simResult=null;
  state.draft = {committed:[], current:null, usedIds:[], rerollsLeft:DRAFT_MAX_REROLLS};
  drawNextDraftTrio();
  state.screen='draft';
  render();
}

function drawNextDraftTrio(){
  const usedSet = new Set(state.draft.usedIds);
  let cands = GLOBAL_TRIOS.filter(t=>!usedSet.has(t.id));
  if(cands.length===0) cands = GLOBAL_TRIOS;
  const trio = pickRandomFrom(cands);
  state.draft.current = trio;
  state.draft.usedIds.push(trio.id);
}

function draftRerollCurrent(){
  if(!state.draft || state.draft.rerollsLeft<=0) return;
  state.draft.rerollsLeft--;
  drawNextDraftTrio();
  render();
}

function pickDraftMc(mcId){
  state.draft.committed.push({trio:state.draft.current, mcId});
  if(state.draft.committed.length>=3){
    state.selected = state.draft.committed.map(c=>c.mcId);
    state.usingRealTrio = null;
    startRun();
  } else {
    state.draft.current = null;
    drawNextDraftTrio();
    render();
  }
}

    </div>

    <div style="text-align:center; margin-top:14px;">

/* ============================= RUN / PHASE ENGINE ============================= */
function buildRunSingleEdition(){
  const e = ed();
  const playerSet = new Set(state.selected);
  const overlaps = (t)=> t.members.some(m=>playerSet.has(m));
  const used = new Set();
  const opponents = {};
  const useFixed = !!state.usingRealTrio;
  STAGE_ORDER.forEach(st=>{
    const cfg = e.phasePlan[st];
    let trio = null;
    if(useFixed && cfg.trioId){
      const fixed = e.trioMap[cfg.trioId];
      if(fixed && !used.has(fixed.id) && !overlaps(fixed)) trio = fixed;
    }
    if(!trio){
      let cands = Object.values(e.trioMap).filter(t=>!used.has(t.id) && !overlaps(t));
      if(cands.length===0) cands = Object.values(e.trioMap).filter(t=>!used.has(t.id));
      if(cands.length===0) cands = Object.values(e.trioMap); // último recurso: reaproveita um trio já usado
      trio = cands[Math.floor(Math.random()*cands.length)];
    }
    used.add(trio.id);
    opponents[st]=trio;
  });
  return {opponents, stageIdx:0, wins:{}, results:[], pool:Object.values(e.trioMap), mvpScores:{}};
}

function buildRunGlobal(){
  const playerSet = new Set(state.selected);
  const overlaps = (t)=> t.members.some(m=>playerSet.has(m));
  const used = new Set();
  const opponents = {};
  STAGE_ORDER.forEach(st=>{
    let cands = GLOBAL_TRIOS.filter(t=>!used.has(t.id) && !overlaps(t));
    if(cands.length===0) cands = GLOBAL_TRIOS.filter(t=>!used.has(t.id));
    if(cands.length===0) cands = GLOBAL_TRIOS; // último recurso: reaproveita um trio já usado
    const trio = cands[Math.floor(Math.random()*cands.length)];
    used.add(trio.id);
    opponents[st]=trio;
  });
  return {opponents, stageIdx:0, wins:{}, results:[], pool:GLOBAL_TRIOS, mvpScores:{}};
}

function buildRun(){ return state.mode==='draft12' ? buildRunGlobal() : buildRunSingleEdition(); }

function startRun(){
  if(state.selected.length!==3) return;
  state.run = buildRun();
  state.battle = null;
  state.simResult = null;
  state.selected.forEach(id=>{
    state.profile.stats.mcUsage[id] = (state.profile.stats.mcUsage[id]||0)+1;
  });
  saveProfile();
  state.screen='prep';
  render();
}

/* ============================= BATTLE ENGINE (round a round, pausado) ============================= */
function trioAvg(ids){ return ids.reduce((s,id)=>s+mcById(id).ovr,0)/ids.length; }

function genScore(mine, theirs, bonus){
  bonus = bonus || 0;
  let base = 2.8 + (mine - theirs)/30 + bonus;
  base += (Math.random()*2.6 - 1.3);
  base = Math.max(1.6, Math.min(4.0, base));
  return Math.round(base*10)/10;
}

function cornerClass(side, i, posClass){
  const b = state.battle.current;
  let cls = 'corner-mc '+posClass+(side==='rival'?' rival-side':'');
  if(!b) return cls+' active';
  const isRelevant = b.type==='trio' || b.mIdx===i;
  cls += isRelevant? ' active' : ' dim';
  if((b.phase==='clash' || b.phase==='score') && isRelevant){ cls += ' rapping'; }
  if(b.phase==='result' && isRelevant){
    const won = (side==='you' && b.winner==='you') || (side==='rival' && b.winner==='rival');
    cls += won? ' winner' : ' loser';
  }
  return cls;
}

function beginStage(){
  const stage = STAGE_ORDER[state.run.stageIdx];
  const rivalTrio = state.run.opponents[stage];
  state.battle = {rounds:[], sy:0, sr:0, roundNum:0, crowd:50, current:null, done:false, rivalTrio, xpGained:0, leveledUp:false, newLevel:state.profile.level};
  state.screen='battle';
  render();
  setTimeout(playRound, 700);
}

function retryStage(){ beginStage(); }

function playRound(){
  const b = state.battle;
  if(!b || b.sy>=3 || b.sr>=3 || b.roundNum>=5){ endStage(); return; }
  const rivalMembers = b.rivalTrio.members;
  const idx = b.roundNum;
  const type = idx<2 ? 'trio' : 'ind';
  let valA, valB, labelA, labelB, mIdx=null;
  if(type==='trio'){
    valA = trioAvg(state.selected); valB = trioAvg(rivalMembers);
    labelA = 'Seu trio'; labelB = trioDisplayLabel(b.rivalTrio);
  } else {
    mIdx = idx-2;
    const a = mcById(state.selected[mIdx]); const c = mcById(rivalMembers[mIdx]);
    valA = a.ovr; valB = c.ovr; labelA = a.name; labelB = c.name;
  }
  // mecânica de virada: quem está atrás no placar de rounds ganha um empurrão
  const deficit = b.sr - b.sy; // positivo = você está atrás
  const youComeback = Math.max(0, deficit) * 0.28;
  const rivalComeback = Math.max(0, -deficit) * 0.28;

  // momentum da torcida: quem está com a torcida a favor ganha um empurrão extra
  const crowdLean = (b.crowd - 50) / 50; // -1 (toda pra o rival) .. 1 (toda pra você)
  const youCrowdBonus = crowdLean * 0.5;
  const rivalCrowdBonus = -crowdLean * 0.5;

  let scoreA = genScore(valA, valB, youComeback + youCrowdBonus);
  let scoreB = genScore(valB, valA, rivalComeback + rivalCrowdBonus);
  if(scoreA===scoreB){ if(valA>=valB) scoreA=Math.min(4,Math.round((scoreA+0.2)*10)/10); else scoreB=Math.min(4,Math.round((scoreB+0.2)*10)/10); }
  const winner = scoreA>scoreB ? 'you' : 'rival';

  b.roundNum++;
  b.current = {type, labelA, labelB, mIdx, scoreA, scoreB, winner, phase:'intro'};
  paintBattle();

  setTimeout(()=>{ b.current.phase='clash'; paintBattle(); }, 750);
  setTimeout(()=>{ b.current.phase='score'; paintBattle(); }, 1750);
  setTimeout(()=>{
    b.current.phase='result';
    if(winner==='you') b.sy++; else b.sr++;
    b.crowd = Math.max(6, Math.min(94, b.crowd + (scoreA-scoreB)*6));
    b.rounds.push({...b.current, reaction:CROWD_REACT[Math.floor(Math.random()*CROWD_REACT.length)]});
    paintBattle();
  }, 2700);
  setTimeout(playRound, 3600);
}

function endStage(){
  const b = state.battle; b.done = true;
  const stage = STAGE_ORDER[state.run.stageIdx];
  const won = b.sy > b.sr;

  state.profile.stats.battlesFought++;
  if(won) state.profile.stats.battlesWon++;
  updateMvpScores(b.rounds);

  const xpInfo = awardXP(won, stage, b);
  b.xpGained = xpInfo.gained; b.leveledUp = xpInfo.leveledUp; b.newLevel = xpInfo.level;
  if(won){
    state.run.wins[stage]=true;
    state.run.results.push({stage, sy:b.sy, sr:b.sr, rival:b.rivalTrio});
  } else {
    state.run.wins[stage]=false;
  }
  saveProfile();
  paintBattle();
}

function proceedAfterWin(){
  const stage = STAGE_ORDER[state.run.stageIdx];
  if(stage==='final'){
    recordChampionStats();
    state.screen='champion'; render();
  } else {
    state.run.stageIdx++; state.battle=null; state.screen='prep'; render();
  }
}

function goEliminated(){
  recordEliminationStats();
  state.screen='eliminated';
  render();
}

/* ---------- MVP (trio conta, individual pesa mais) ---------- */
function updateMvpScores(rounds){
  if(!state.run.mvpScores) state.run.mvpScores = {};
  const add = (id, pts)=>{ state.run.mvpScores[id] = (state.run.mvpScores[id]||0) + pts; };
  rounds.forEach(r=>{
    if(r.type==='trio'){
      if(r.winner==='you'){ state.selected.forEach(id=> add(id, 1)); }
    } else {
      const mcId = state.selected[r.mIdx];
      if(r.winner==='you'){ add(mcId, 3 + Math.max(0, r.scoreA-r.scoreB)); }
      else { add(mcId, 0.3); }
    }
  });
}
function getMvp(){
  const scores = (state.run && state.run.mvpScores) || {};
  let best = state.selected[0], bestScore = -1;
  state.selected.forEach(id=>{ const s = scores[id]||0; if(s>bestScore){ bestScore=s; best=id; } });
  return mcById(best);
}

/* ---------- XP / NÍVEL ---------- */
function awardXP(won, stage, battle){
  let gained = 0;
  if(won){
    gained += STAGE_XP[stage] || 50;
    const margin = battle.rounds.reduce((s,r)=> s + (r.winner==='you'? Math.max(0,(r.scoreA-r.scoreB)) : 0), 0);
    gained += Math.round(margin*4);
    if(stage==='final') gained += CHAMPION_BONUS;
  } else {
    gained += 15;
  }
  const before = state.profile.level;
  state.profile.xp += gained;
  state.profile.level = Math.floor(state.profile.xp/XP_PER_LEVEL)+1;
  const leveledUp = state.profile.level > before;
  return {gained, leveledUp, level:state.profile.level};
}

function recordChampionStats(){
  const mvp = getMvp();
  state.profile.stats.championships++;
  state.profile.stats.mvpCount[mvp.id] = (state.profile.stats.mvpCount[mvp.id]||0)+1;
  state.selected.forEach(id=>{ state.profile.stats.championCount[id] = (state.profile.stats.championCount[id]||0)+1; });
  if(state.mode!=='draft12'){
    const e = ed();
    state.profile.editionHistory[e.key] = {
      championIds: state.selected.slice(),
      mvpId: mvp.id,
      usingReal: !!state.usingRealTrio,
      timestamp: Date.now(),
    };
  }
  saveProfile();
}
function recordEliminationStats(){
  const mvp = getMvp();
  state.profile.stats.mvpCount[mvp.id] = (state.profile.stats.mvpCount[mvp.id]||0)+1;
  saveProfile();
}

  const scoreEl = document.getElementById('roundScore');

      scoreEl.innerHTML = `<div class="round-scorebox"><span class="sc you" style="opacity:.25">?,?</span><span class="slash">×</span><span class="sc rival" style="opacity:.25">?,?</span></div>`;
    } else {

  if(histEl){
    const typeLbl = t => t==='trio' ? 'Trio a trio' : 'Individual';
    histEl.innerHTML = b.rounds.map((r,i)=>`<div class="history-item ${r.winner}">

      <span class="sc">${r.scoreA.toFixed(1).replace('.',',')} × ${r.scoreB.toFixed(1).replace('.',',')}</span>
    </div>`).join('');

/* ============================= SIMULAÇÃO DO RESTO DO CAMPEONATO ============================= */
function simulateQuickMatch(trioA, trioB){
  let wa=0, wb=0;
  for(let i=0;i<5 && wa<3 && wb<3;i++){
    const a = genScore(trioAvg(trioA.members), trioAvg(trioB.members));
    const b = genScore(trioAvg(trioB.members), trioAvg(trioA.members));
    if(a>=b) wa++; else wb++;
  }
  return wa>wb? trioA : trioB;
}

function continueSimulation(){
  const stage = STAGE_ORDER[state.run.stageIdx];
  const startIdx = STAGE_ORDER.indexOf(stage);
  const pool = state.run.pool;
  let advancing = state.run.opponents[stage];
  const usedIds = new Set([advancing.id, ...Object.values(state.run.opponents).map(t=>t.id)]);
  const log = [];
  for(let i=startIdx+1;i<STAGE_ORDER.length;i++){
    const st = STAGE_ORDER[i];
    let candidates = pool.filter(t=>!usedIds.has(t.id) && !t.members.some(m=>advancing.members.includes(m)));
    if(candidates.length===0) candidates = pool.filter(t=>!usedIds.has(t.id));
    if(candidates.length===0) break;
    const challenger = candidates[Math.floor(Math.random()*candidates.length)];
    usedIds.add(challenger.id);
    const winner = simulateQuickMatch(advancing, challenger);
    log.push({stage:st, a:advancing, b:challenger, winner});
    advancing = winner;
  }
  state.simResult = {log, champion:advancing};
  render();
}

/* ============================= PERFIL (XP / NÍVEL / HISTÓRICO) — persistência entre sessões ============================= */
const PROFILE_KEY = 'aldeiaverso_profile';

function mergeProfileDefaults(p){
  if(!p.stats) p.stats = {};
  const statDefaults = {battlesFought:0, battlesWon:0, championships:0, mcUsage:{}, mvpCount:{}, championCount:{}};
  Object.keys(statDefaults).forEach(k=>{ if(p.stats[k]===undefined) p.stats[k] = statDefaults[k]; });
  if(!p.editionHistory) p.editionHistory = {};
  return p;
}

async function initProfile(){
  let raw = null;
  // 1) armazenamento persistente do artefato (funciona dentro do Claude.ai entre sessões)
  if(typeof window.storage !== 'undefined' && window.storage){
    try{
      const res = await window.storage.get(PROFILE_KEY, false);
      if(res && res.value) raw = res.value;
    }catch(e){ /* ainda não existe perfil salvo nesse armazenamento */ }
  }
  // 2) fallback: localStorage do próprio navegador — garante que o progresso sobreviva
  //    a fechar/reabrir a aba mesmo se o arquivo for salvo e aberto fora do Claude.ai
  if(!raw){
    try{ raw = localStorage.getItem(PROFILE_KEY); }catch(e){ /* localStorage indisponível (ex: modo privado) */ }
  }
  if(raw){
    try{
      const p = JSON.parse(raw);
      if(p && typeof p.xp==='number' && typeof p.level==='number'){ state.profile = mergeProfileDefaults(p); }
    }catch(e){ /* JSON inválido — mantém o perfil padrão */ }
  }
  render();
}

async function saveProfile(){
  const json = JSON.stringify(state.profile);
  if(typeof window.storage !== 'undefined' && window.storage){
    try{ await window.storage.set(PROFILE_KEY, json, false); }catch(e){ /* storage do artefato indisponível */ }
  }
  try{ localStorage.setItem(PROFILE_KEY, json); }catch(e){ /* localStorage indisponível (ex: modo privado) */ }
}

render();
initProfile();
</script>
</body>
</html>
